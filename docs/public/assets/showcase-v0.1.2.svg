<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">SilverStar v0.1.2: SCG, GSHC and FLP</title>
<desc id="desc">Workflow illustration, not an application screenshot. SCG configures and generates projects, GSHC monitors AIR M0 telemetry, and FLP opens recorded logs with their exact decoder. Hardware is required for real acquisition.</desc>
