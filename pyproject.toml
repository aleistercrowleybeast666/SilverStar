[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "silverstar-suite"
dynamic = ["version"]
description = "SilverStar Rocket Avionics & Ground Suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8", "PyYAML>=6.0,<7", "numpy>=2.0",
  "matplotlib>=3.9", "pyqtgraph>=0.13.7", "PyOpenGL>=3.1.7",
  "Pillow>=10.4", "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-qt>=4.4", "ruff>=0.9", "pyinstaller>=6.21", "packaging>=24"]

[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
version = {attr = "silverstar_version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
addopts = "-ra --basetemp=.work/pytest"
cache_dir = ".work/pytest-cache"
