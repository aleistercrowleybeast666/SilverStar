<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SilverStar GSHC · HTML design preview, not APK</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dce6eb;color:#1d3443;font-family:system-ui,"Microsoft YaHei",sans-serif}.reviewer{padding:16px;max-width:1240px;margin:auto}.reviewer h1{font-size:20px;margin:0 0 8px}.reviewer p{line-height:1.6;margin:8px 0}.review-controls{display:flex;gap:8px;flex-wrap:wrap}button,select{font:inherit;color:inherit}button{cursor:pointer}.device{--scale:1;width:360px;height:800px;margin:12px auto;display:flex;flex-direction:column;background:#edf3f5;overflow:hidden;font-size:calc(14px * var(--scale));box-shadow:0 12px 40px #173b5226}.preview-mark{font:10px system-ui,sans-serif;letter-spacing:.08em;background:#142f40;color:#e4f4fa;padding:4px 10px;flex:none}.header{flex:none;background:#fff;border-bottom:1px solid #d6e3ea;padding:8px 12px}.brand{font-size:calc(18px * var(--scale));font-weight:750;letter-spacing:.04em;line-height:1.25;margin-bottom:5px;overflow-wrap:anywhere}.status{font-size:calc(12px * var(--scale));color:#377768;line-height:1.35;margin-bottom:8px}.ports{display:grid;grid-template-columns:1fr;gap:6px}.wide-ports .ports{grid-template-columns:repeat(2,minmax(0,1fr))}.port{min-width:0;border:1px solid #b8cdd9;background:#f5fafc;border-radius:8px;text-align:left;padding:8px 10px;min-height:56px;line-height:1.3}.port-top{display:flex;justify-content:space-between;gap:6px;align-items:center}.port-role{font-weight:700;font-size:calc(14px * var(--scale))}.port-state{font-size:calc(11px * var(--scale));color:#667b89;white-space:nowrap}.port-meta{display:block;font-size:calc(11px * var(--scale));color:#667b89;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.header-toggle{display:none;background:transparent;border:0;padding:5px 0 0;min-height:32px;font-size:calc(11px * var(--scale));color:#45667c;text-align:left}.compact-header .brand{display:none}.compact-header .status{margin-bottom:5px}.compact-header .header-toggle{display:block}.compact-header:not(.details-open) .port-meta{display:none}.compact-header .port{min-height:48px;padding:6px 10px}.compact-header .header{padding-top:5px;padding-bottom:5px}main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px;scrollbar-width:thin;overscroll-behavior:contain}.page-heading{margin:0 0 10px;font-size:1.35em;line-height:1.3}.card{background:white;border:1px solid #dce6ec;border-radius:10px;padding:14px;margin-bottom:12px;min-width:0}.card h2{font-size:1.12em;margin:0 0 10px;line-height:1.35}.card p{font-size:1em;line-height:1.55;margin:8px 0;overflow-wrap:anywhere}.muted{color:#647c8a}.chip{display:inline-block;padding:3px 8px;border-radius:5px;background:#e7f3ee;color:#2f6a53;font-size:.83em;margin-bottom:5px}.actions{display:grid;gap:8px}.action,.file{border:1px solid #b7ccda;border-radius:7px;background:#f9fcfe;padding:10px 12px;min-height:48px;line-height:1.4;text-align:left;font-size:inherit;overflow-wrap:anywhere;min-width:0;width:100%}.primary{background:#255d7c;color:#fff;border-color:#255d7c}.action:disabled{color:#74838c;background:#f0f3f5}.state-grid{display:grid;gap:12px}.expanded .state-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.state-grid .card{margin-bottom:0}.key-values{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px 12px;font-size:.94em}.key-values span{overflow-wrap:anywhere}.key-values strong{color:#245b75;overflow-wrap:anywhere}.plots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.expanded .plots{grid-template-columns:repeat(3,minmax(0,1fr))}.plot{height:calc(202px * var(--scale));min-width:0;border-radius:8px;background:white;border:1px solid #dce6ec;padding:10px;display:flex;flex-direction:column}.plot b{font-size:.92em;line-height:1.3}.value{font-size:1.3em;margin-top:8px;font-weight:650}.unit{font-size:.74em;color:#647b8b}.plot svg{width:100%;flex:1;min-height:24px;margin:8px 0}.plot-foot{font-size:.7em;color:#728693}.file{margin:8px 0}.file small{display:block;font-size:.8em;color:#638091;margin-top:5px}.diagnostic{font:inherit;font-size:.9em;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:6px;background:white;border-top:1px solid #d6e3ea;flex:none}.nav button{border:0;border-radius:7px;padding:8px 3px;min-height:48px;min-width:0;background:#fff;font-size:calc(13px * var(--scale));line-height:1.2;overflow-wrap:anywhere}.nav .selected{background:#235c7a;color:white}.caption{font-size:13px;color:#526e80}body.capture{background:#edf3f5}body.capture .reviewer{display:none}body.capture .device{margin:0;box-shadow:none}#layout-check{display:none}
</style>
<section class="reviewer"><h1>SilverStar GSHC · 四页布局预览</h1><p>HTML 设计预览，不是 APK、模拟器或真机截图。所有数据均为示例；按钮仅演示布局，不连接设备。</p><div class="review-controls"><select id="size"><option value="360,800">手机 360×800</option><option value="1200,800">平板 1200×800</option><option value="480,800">分屏 480×800</option><option value="640,360">短横屏 640×360</option></select><button id="font">字体 100%</button></div><p class="caption">顶部仅一组独立端口：地面站在左、飞控调试在右；窄窗上下排列。大字体或短窗默认收起端口详情，角色入口始终可见。此折叠是待原生实现的布局建议。</p></section>
<div class="device" id="device"><div class="preview-mark">HTML PREVIEW ONLY · NOT APK · SIMULATED</div><header class="header"><div class="brand">SILVERSTAR / GSHC</div><div class="status">模拟 · 只读 · 原始记录中</div><div class="ports"><button class="port" data-port="ground" title="地面站端口详情"><span class="port-top"><span class="port-role">地面站口</span><span class="port-state">未连接</span></span><span class="port-meta">230400 / 8N1 · 选择设备 / 端口</span></button><button class="port" data-port="debug" title="飞控调试端口详情"><span class="port-top"><span class="port-role">飞控调试口</span><span class="port-state">未连接</span></span><span class="port-meta">维护通道 · 波特率与设备匹配</span></button></div><button class="header-toggle" id="header-toggle">展开端口详情 ▾</button></header><main id="main"></main><nav class="nav" aria-label="主导航"><button data-page="0">预飞行</button><button data-page="1">飞行</button><button data-page="2">后期处理</button><button data-page="3">调试与维护</button></nav></div>
<script>
const q=new URLSearchParams(location.search);let page=Number(q.get('page')||0),width=Number(q.get('width')||360),height=Number(q.get('height')||800),scale=Number(q.get('scale')||1);const device=document.querySelector('#device'),main=document.querySelector('#main');
if(q.get('capture')==='1')document.body.classList.add('capture');
const names=['预飞行','飞行','后期处理','调试与维护'];
function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function render(){device.style.width=width+'px';device.style.height=height+'px';device.style.setProperty('--scale',scale);device.classList.toggle('expanded',width>=840);device.classList.toggle('wide-ports',width>=600);device.classList.toggle('compact-header',scale>=1.6||height<500);document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('selected',Number(b.dataset.page)===page);b.setAttribute('aria-current',Number(b.dataset.page)===page?'page':'false')});
let body='';
if(page===0)body=card('链路状态与仿真','<span class="chip">模拟数据 · 无设备动作</span><p>端口在顶部统一管理。地面站使用 GSP-MIN / AIR M0。</p><div class="actions"><button class="action primary">开始仿真并记录</button><button class="action">停止记录 / 断开</button></div>')+'<div class="state-grid">'+card('准备与健康','<div class="key-values"><span>协议支持</span><strong>已识别</strong><span>权威状态</span><strong>新鲜</strong><span>READY</span><strong>是</strong><span>生命周期</span><strong>READY</strong><span>校准 / 对准</span><strong>READY</strong><span>GNSS</span><strong>可用</strong></div>')+card('只读命令策略','<p>ACK 不代表 READY。当前没有设备命令发送接口。</p><div class="actions"><button class="action" disabled>解锁 / START · 已禁用</button><button class="action">查看操作约束</button></div>')+'</div>';
if(page===1){const order=width>=840?[0,1,2,3,4,5]:[0,3,1,4,2,5];body=card('当前飞行状态','<span class="chip">FLIGHT_STATE · 模拟</span><p>飞行时间 12,000 ms<br>速度 ENU：1.20，−0.50，4.80 m/s<br>位置 ENU：8.60，−3.20，26.50 m</p>')+'<p class="muted">实时曲线 · 最近 300 样本</p><div class="plots">'+order.map(i=>`<article class="plot" data-channel="${i}"><b>${'ENU'[i%3]} · ${i<3?'速度':'位置'}</b><div class="value">${[1.2,-.5,4.8,8.6,-3.2,26.5][i].toFixed(2)}</div><div class="unit">${i<3?'m/s':'m'} · 模拟</div><svg viewBox="0 0 160 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 25H160M0 50H160M0 75H160" fill="none" stroke="#dde8ef"/><path d="M0 85L12 82L25 85L37 70L48 72L60 54L70 60L85 42L98 30L110 37L124 25L136 32L148 18L160 12" fill="none" stroke="${i<3?'#276a92':'#387f6a'}" stroke-width="2.5"/></svg><span class="plot-foot">旧 ← 时间 → 新</span></article>`).join('')+'</div>'}
if(page===2)body=card('原始会话与文件','<p>查看、回放、导出已保存的原始会话。TF 下载与维护位于第四页。</p><div class="actions"><button class="action primary">导入原始 JSONL</button><button class="action">回收站 / 恢复</button></div>')+card('会话列表','<button class="file">仿真会话 · 12:05:32<small>simulation · 已停止 · JSONL</small></button><button class="file">TF 文件 · 000001<small>原始 SSLOG 0.0 · 本地校验完成</small></button><p class="muted">选择会话后查看、重命名、只读回放或导出。剪切需目标逐文件回读校验，并再次确认。</p>');
if(page===3)body=card('运行诊断','<span class="chip">顶部管理连接 · 本页仅诊断与维护</span><div class="diagnostic">数据来源：simulation<br>连接代次：1<br>AIR profile：已识别<br>权威状态：新鲜<br>最后消息：PREFLIGHT_STATUS<br>故障：暂无记录</div>')+card('TF 文件维护 · LOGFILE v1','<p>独立飞控调试口 · 仅已关闭日志。真实与模拟下载均须先选目标目录。</p><div class="actions"><button class="action primary" data-target-select>选择目标目录</button></div><p class="target-summary">目标：尚未选择系统文件夹<br><span class="muted">可持久授权时记住 URI；再次使用前检查权限。</span></p><div class="actions"><button class="action">查询能力 / 目录</button><button class="action" data-download="real" disabled>自动下载 / 校验 · 请先选目录</button><button class="action" data-download="mock" disabled>模拟下载 / 校验 · 请先选目录</button><button class="action" disabled>设备删除 · 当前禁用</button></div><p class="muted">内部暂存并校验后，复制到目标目录；逐文件回读验证通过才报告成功。保留原始字节，不覆盖同名文件，不删除 TF 源文件。</p>');
main.innerHTML='<h1 class="page-heading">'+names[page]+'</h1>'+body;main.scrollTop=0;document.querySelector('#font').textContent='字体 '+scale*100+'%';checkLayout();}
function checkLayout(){requestAnimationFrame(()=>{const nodes=[...device.querySelectorAll('*')].filter(n=>!n.classList.contains('port-meta'));const overflow=nodes.filter(n=>n.clientWidth>0&&n.scrollWidth>n.clientWidth+1).map(n=>n.className||n.tagName);const plots=[...device.querySelectorAll('[data-channel]')];const ports=[...device.querySelectorAll('[data-port]')];const mainRect=main.getBoundingClientRect();const bottom=main.scrollHeight-main.clientHeight;main.scrollTop=bottom;const scrollReachable=main.scrollTop>=bottom-1;main.scrollTop=0;let result=document.querySelector('#layout-check');if(!result){result=document.createElement('pre');result.id='layout-check';document.body.append(result)}result.textContent=JSON.stringify({previewOnly:true,androidExecuted:false,page,pageName:names[page],width,height,scale,compactHeader:device.classList.contains('compact-header'),headerCollapsed:device.classList.contains('compact-header')&&!device.classList.contains('details-open'),mainAvailablePx:Math.round(mainRect.height),mainScrollHeight:main.scrollHeight,scrollReachable,overflow,portCount:ports.length,portOrder:ports.map(p=>p.dataset.port),portLayout:width>=600?'horizontal':'vertical',portRects:ports.map(p=>({x:Math.round(p.getBoundingClientRect().x),y:Math.round(p.getBoundingClientRect().y)})),duplicatePagePortControls:main.querySelectorAll('[data-port]').length,downloadRequiresTarget:page===3&&main.querySelectorAll('[data-target-select]').length===1&&main.querySelectorAll('[data-download]:disabled').length===2,screenshotSection:page===3?'tf-maintenance-card':'top',columns:plots.length?getComputedStyle(document.querySelector('.plots')).gridTemplateColumns.split(' ').length:0,order:plots.map(n=>Number(n.dataset.channel))});if(page===3&&q.get('capture')==='1'){const target=main.querySelector('[data-target-select]').closest('.card');main.scrollTop=target.offsetTop-main.offsetTop;}})}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=Number(b.dataset.page);render()});document.querySelector('#size').onchange=e=>{[width,height]=e.target.value.split(',').map(Number);render()};document.querySelector('#font').onclick=()=>{scale=scale===1?2:1;render()};document.querySelector('#header-toggle').onclick=e=>{device.classList.toggle('details-open');e.target.textContent=device.classList.contains('details-open')?'收起端口详情 ▴':'展开端口详情 ▾';checkLayout()};document.querySelectorAll('[data-port]').forEach(b=>b.onclick=()=>alert((b.dataset.port==='ground'?'地面站口：遥测接收':'飞控调试口：维护文件服务')+'。HTML 预览不连接设备。'));const selector=document.querySelector('#size');selector.value=width+','+height;render();
</script></html>
