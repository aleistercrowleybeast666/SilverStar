[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "silverstar-flp"
dynamic = ["version"]
description = "SilverStar SSLOG0 flight-log parser, navigation replay, visualization, and export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "PySide6>=6.8",
    "pyqtgraph>=0.13.7",
    "PyOpenGL>=3.1.7",
    "matplotlib>=3.9",
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.9",
]
packaging = [
    "pyinstaller>=6.21",
]

[project.scripts]
silverstar-flp = "silverstar_flp.app.application:main"
sslog = "silverstar_flp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "silverstar_flp.app.version.__version__"}

[tool.setuptools.package-data]
silverstar_flp = ["i18n/*.json", "plugins/algorithms/eskf15/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
